# Font
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Cursor
cursor            #ffffff
cursor_text_color #1a1d23
cursor_shape      block
cursor_blink_interval -1

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
url_color       #0087bd
url_style       curly

# Bell
enable_audio_bell no

# Window
remember_window_size yes
enabled_layouts      splits,stack
window_padding_width 0
window_border_width  0.5pt
active_border_color   #88b4e8
inactive_border_color #525a6e

# Colors — Ghostty defaults, slightly darkened with more contrast
foreground           #ffffff
background           #1a1d23
selection_foreground #1a1d23
selection_background #ffffff

color0   #0e1013
color1   #c96060
color2   #c3ca7a
color3   #f0d070
color4   #7fa8d6
color5   #b89ecc
color6   #7ec4bc
color7   #d0d3d0
color8   #525a6e
color9   #d45f5f
color10  #c8d560
color11  #ecd060
color12  #88b4e8
color13  #c9a8e0
color14  #8ecec6
color15  #f0f0f0

# Tab bar
tab_bar_edge          bottom
tab_bar_style         powerline
tab_bar_min_tabs      2

active_tab_foreground   #1a1d23
active_tab_background   #d0d3d0
active_tab_font_style   bold
inactive_tab_foreground #c5c8c6
inactive_tab_background #1d1f21
inactive_tab_font_style normal

# Advanced
shell  zsh
editor vim
linux_display_server wayland

# Keyboard
kitty_mod ctrl+shift

map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

map ctrl+e     launch --location=vsplit --cwd=current
map ctrl+o     launch --location=hsplit --cwd=current
map ctrl+enter launch --location=hsplit --cwd=current
map ctrl+h     previous_window
map ctrl+l     next_window
map ctrl+w     close_window
map ctrl+x     kitten zoom_window.py

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
map kitty_mod+t     new_tab
map kitty_mod+q     close_tab

map ctrl+up        scroll_line_up
map ctrl+k         scroll_line_up
map ctrl+down      scroll_line_down
map ctrl+j         scroll_line_down
map ctrl+page_up   scroll_page_up
map ctrl+page_down scroll_page_down
map ctrl+home      scroll_home
map ctrl+end       scroll_end

map kitty_mod+n   new_os_window
map kitty_mod+f11 toggle_fullscreen
